<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Área Restrita | Brasilidades</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- CSS original do site (aproveita navbar, footer, etc.) -->
    <link href="../css/style.css" rel="stylesheet">
    <!-- Ícone da aba (mesmo do site) -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=611&format=png&color=000000">

    <style>
        /* ===== SOBRESCREVE ESTILOS DO style.css PARA O LOGIN ===== */

        body {
            background-color: #f4f1ea !important; /* mesmo fundo da seção "história" */
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Card do login */
        .login-container {
            max-width: 420px;
            margin: 100px auto 50px; /* espaçamento superior e inferior */
        }

        .card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* Cabeçalho do card — verde Brasilidades */
        .card-header-brasil {
            background-color: #1f4d3a;
            color: white;
            font-family: serif;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            padding: 20px;
            border-bottom: none;
        }

        .card-header-brasil i {
            margin-right: 8px;
            color: #ffd166;
        }

        /* Corpo do card */
        .card-body {
            background-color: #fff;
            padding: 30px;
        }

        /* Campos de formulário */
        .form-label {
            color: #4a4a4a;
            font-weight: 500;
            font-size: 14px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #d65a3f;
            box-shadow: 0 0 0 0.2rem rgba(230, 111, 81, 0.25); /* terracota suave */
        }

        /* Botão principal — tom terracota do site */
        .btn-login {
            background-color: #e76f51;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            padding: 12px 0;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background-color: #d65a3f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 111, 81, 0.3);
        }

        .btn-login i {
            margin-left: 8px;
        }

        /* Caixa informativa */
        .info-box-brasil {
            background-color: #f2dfd6; /* tom terracota muito claro, igual ao destaque */
            border: 1px solid #e76f5130;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            color: #5a3e36;
        }

        .info-box-brasil h6 {
            font-family: serif;
            font-weight: 700;
            color: #1f4d3a;
            margin-bottom: 6px;
        }

        .info-box-brasil p {
            font-size: 13px;
            margin: 0;
            color: #7a5a4f;
        }

        /* Link "Voltar" personalizado */
        .link-voltar {
            color: #1f4d3a;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .link-voltar:hover {
            color: #e76f51;
        }

        .link-voltar i {
            margin-right: 6px;
        }

        /* Alerta de erro (escondido por padrão) */
        #erroLogin {
            background-color: #fde8e4;
            border: 1px solid #e76f5140;
            color: #b1442e;
            border-radius: 10px;
            font-size: 14px;
            padding: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Container central do login -->
    <div class="container login-container">

        <!-- Link para voltar à página inicial -->
        <div class="text-center">
            <a href="index.html" class="link-voltar">
                <i class="fas fa-arrow-left"></i> Voltar para a página inicial
            </a>
        </div>

        <!-- Card principal do login -->
        <div class="card shadow-sm border-0">

            <!-- Cabeçalho verde -->
            <div class="card-header-brasil">
                <i class="fas fa-lock"></i> Acesso Restrito
            </div>

            <!-- Corpo -->
            <div class="card-body p-4">

                <form id="loginForm" onsubmit="event.preventDefault(); alert('Na Fase 2 isso fará o login no Backend!');">

                    <!-- Usuário -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="far fa-user me-1"></i> Usuário
                        </label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            placeholder="Digite seu usuário" 
                            required
                        >
                    </div>

                    <!-- Senha -->
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-key me-1"></i> Senha
                        </label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            placeholder="Digite sua senha" 
                            required
                        >
                    </div>

                    <!-- Mensagem de erro (inicialmente oculta) -->
                    <div id="erroLogin" class="d-none">
                        <i class="fas fa-exclamation-circle me-1"></i>
                        <span id="erroLoginMsg">Usuário ou senha inválidos.</span>
                    </div>

                    <!-- Botão de login -->
                    <button type="submit" class="btn btn-login">
                        Entrar no Painel <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <!-- Caixa informativa -->
                <div class="info-box-brasil">
                    <h6>
                        <i class="fas fa-info-circle"></i> Acesso ao Sistema
                    </h6>
                    <p>
                        Apenas demonstração visual nesta etapa. Em breve o sistema de autenticação estará ativo.
                    </p>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS (necessário para componentes interativos, caso use no futuro) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
